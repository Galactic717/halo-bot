# The same four commands the README tells a person to run, on every push.
#
# The desktop job runs on Windows because that is the platform the product targets: the box helper,
# the integrity labelling and half the policy floor are Windows-specific, and a green Linux run would
# be checking a different program. The Android job is platform-independent JVM tests and runs on
# Linux, where its toolchain is cheapest.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Windows — typecheck, tests, end to end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: End to end, against a scripted model
        run: npm run verify
      - name: Build
        run: npm run build

  android:
    name: Android — JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
